<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <!-- Background -->
  <rect width="900" height="600" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="450" y="40" font-family="Arial" font-size="24" text-anchor="middle" fill="#2c3e50">Physics Concepts in Digital Twin Simulation</text>

  <!-- Section 1: Gravity Comparison -->
  <g transform="translate(50, 80)">
    <rect width="350" height="200" fill="white" stroke="#34495e" stroke-width="2" rx="10"/>
    <text x="175" y="25" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">Gravity Configuration</text>

    <!-- Earth gravity -->
    <circle cx="80" cy="100" r="10" fill="#3498db"/>
    <text x="80" y="130" font-family="Arial" font-size="12" text-anchor="middle" fill="#7f8c8d">g = 9.8 m/s²</text>
    <line x1="80" y1="110" x2="80" y2="150" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Moon gravity -->
    <circle cx="175" cy="100" r="10" fill="#3498db"/>
    <text x="175" y="130" font-family="Arial" font-size="12" text-anchor="middle" fill="#7f8c8d">g = 1.62 m/s²</text>
    <line x1="175" y1="110" x2="175" y2="130" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Zero gravity -->
    <circle cx="270" cy="100" r="10" fill="#3498db"/>
    <text x="270" y="130" font-family="Arial" font-size="12" text-anchor="middle" fill="#7f8c8d">g = 0 m/s²</text>
    <text x="270" y="150" font-family="Arial" font-size="10" text-anchor="middle" fill="#7f8c8d">(no movement)</text>
  </g>

  <!-- Section 2: Friction Coefficients -->
  <g transform="translate(450, 80)">
    <rect width="350" height="200" fill="white" stroke="#34495e" stroke-width="2" rx="10"/>
    <text x="175" y="25" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">Friction Coefficients</text>

    <!-- High friction (Rubber on concrete) -->
    <rect x="50" y="50" width="250" height="20" fill="#bdc3c7"/>
    <rect x="50" y="40" width="60" height="30" fill="#e74c3c" transform="rotate(-30 50 40)"/>
    <text x="175" y="65" font-family="Arial" font-size="12" text-anchor="middle" fill="#7f8c8d">μ = 1.0 (Rubber)</text>

    <!-- Medium friction (Wood) -->
    <rect x="50" y="100" width="250" height="20" fill="#bdc3c7"/>
    <rect x="50" y="90" width="35" height="30" fill="#f39c12" transform="rotate(-20 50 90)"/>
    <text x="175" y="115" font-family="Arial" font-size="12" text-anchor="middle" fill="#7f8c8d">μ = 0.5 (Wood)</text>

    <!-- Low friction (Ice) -->
    <rect x="50" y="150" width="250" height="20" fill="#bdc3c7"/>
    <rect x="50" y="140" width="15" height="30" fill="#3498db" transform="rotate(-5 50 140)"/>
    <text x="175" y="165" font-family="Arial" font-size="12" text-anchor="middle" fill="#7f8c8d">μ = 0.1 (Ice)</text>
  </g>

  <!-- Section 3: Collision Shapes -->
  <g transform="translate(50, 320)">
    <rect width="350" height="200" fill="white" stroke="#34495e" stroke-width="2" rx="10"/>
    <text x="175" y="25" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">Collision Shapes</text>

    <!-- Sphere -->
    <circle cx="70" cy="100" r="25" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
    <text x="70" y="145" font-family="Arial" font-size="12" text-anchor="middle" fill="#7f8c8d">Sphere</text>

    <!-- Box -->
    <rect x="140" y="75" width="50" height="50" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <text x="165" y="145" font-family="Arial" font-size="12" text-anchor="middle" fill="#7f8c8d">Box</text>

    <!-- Cylinder -->
    <ellipse cx="250" cy="85" rx="15" ry="8" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
    <rect x="235" y="85" width="30" height="40" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
    <ellipse cx="250" cy="125" rx="15" ry="8" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
    <text x="250" y="145" font-family="Arial" font-size="12" text-anchor="middle" fill="#7f8c8d">Cylinder</text>

    <!-- Capsule (for humanoid limbs) -->
    <circle cx="330" cy="95" r="12" fill="#1abc9c" stroke="#16a085" stroke-width="2"/>
    <rect x="318" y="95" width="24" height="20" fill="#1abc9c" stroke="#16a085" stroke-width="2"/>
    <circle cx="330" cy="115" r="12" fill="#1abc9c" stroke="#16a085" stroke-width="2"/>
    <text x="330" y="145" font-family="Arial" font-size="12" text-anchor="middle" fill="#7f8c8d">Capsule</text>
  </g>

  <!-- Section 4: Physics Parameters -->
  <g transform="translate(450, 320)">
    <rect width="350" height="200" fill="white" stroke="#34495e" stroke-width="2" rx="10"/>
    <text x="175" y="25" font-family="Arial" font-size="16" text-anchor="middle" fill="#2c3e50">Physics Parameters</text>

    <!-- Time Step Impact -->
    <text x="20" y="60" font-family="Arial" font-size="12" fill="#2c3e50">Time Step:</text>
    <text x="20" y="75" font-family="Arial" font-size="10" fill="#7f8c8d">Small = Accurate but Slow</text>
    <text x="20" y="90" font-family="Arial" font-size="10" fill="#7f8c8d">Large = Fast but Less Accurate</text>

    <!-- Solver Iterations -->
    <text x="20" y="120" font-family="Arial" font-size="12" fill="#2c3e50">Solver Iterations:</text>
    <text x="20" y="135" font-family="Arial" font-size="10" fill="#7f8c8d">More = Stable but Slower</text>

    <!-- Real-time Factor -->
    <text x="20" y="160" font-family="Arial" font-size="12" fill="#2c3e50">Real-time Factor:</text>
    <text x="20" y="175" font-family="Arial" font-size="10" fill="#7f8c8d">1.0 = Real-time, 0.1 = 10x slower</text>

    <!-- Visual representation -->
    <rect x="200" y="60" width="130" height="100" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
    <text x="265" y="80" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">Gazebo Physics</text>
    <text x="265" y="95" font-family="Arial" font-size="9" text-anchor="middle" fill="#7f8c8d">Engine</text>
    <text x="265" y="110" font-family="Arial" font-size="9" text-anchor="middle" fill="#7f8c8d">ODE/DART/</text>
    <text x="265" y="125" font-family="Arial" font-size="9" text-anchor="middle" fill="#7f8c8d">Bullet</text>
    <text x="265" y="140" font-family="Arial" font-size="9" text-anchor="middle" fill="#7f8c8d">Settings</text>
  </g>

  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
      refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>
</svg>