<!-- Placeholder SVG for Perception Fundamentals Overview -->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <title>Perception Fundamentals Overview</title>
  <desc>Diagram showing the relationship between different perception sensors and processing pipelines</desc>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa"/>

  <!-- Robot outline -->
  <rect x="50" y="150" width="80" height="100" fill="none" stroke="#333" stroke-width="2" rx="10"/>
  <circle cx="90" cy="130" r="25" fill="none" stroke="#333" stroke-width="2"/>

  <!-- Sensor representations -->
  <g transform="translate(130, 170)">
    <circle r="20" fill="#4e79a7" fill-opacity="0.3" stroke="#4e79a7" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">LiDAR</text>
  </g>

  <g transform="translate(130, 220)">
    <rect x="-20" y="-15" width="40" height="30" fill="#f28e2c" fill-opacity="0.3" stroke="#f28e2c" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">Camera</text>
  </g>

  <g transform="translate(130, 270)">
    <rect x="-15" y="-15" width="30" height="30" fill="#e15759" fill-opacity="0.3" stroke="#e15759" stroke-width="2" rx="5"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">IMU</text>
  </g>

  <!-- Processing pipeline -->
  <g transform="translate(300, 200)">
    <rect x="0" y="-20" width="120" height="40" fill="#8cd17d" fill-opacity="0.3" stroke="#8cd17d" stroke-width="2" rx="5"/>
    <text x="60" y="5" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Sensor Fusion</text>
  </g>

  <g transform="translate(480, 200)">
    <rect x="0" y="-20" width="120" height="40" fill="#b279a2" fill-opacity="0.3" stroke="#b279a2" stroke-width="2" rx="5"/>
    <text x="60" y="5" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Environment Model</text>
  </g>

  <!-- Arrows showing data flow -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>

  <line x1="150" y1="170" x2="300" y2="180" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="150" y1="220" x2="300" y2="200" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="150" y1="270" x2="300" y2="220" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="420" y1="200" x2="480" y2="200" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Labels -->
  <text x="400" y="100" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#333">Perception Fundamentals</text>
  <text x="400" y="120" text-anchor="middle" font-family="Arial" font-size="14" fill="#666">Multi-sensor data processing for robotics</text>
</svg>