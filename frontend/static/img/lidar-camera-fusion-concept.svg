<!-- LiDAR-Camera Fusion Concept Diagram -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>LiDAR-Camera Fusion Concept</title>
  <desc>Diagram showing how LiDAR and camera data are fused together</desc>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa"/>

  <!-- Scene representation -->
  <g transform="translate(50, 100)">
    <!-- Road -->
    <rect x="0" y="150" width="300" height="100" fill="#6c757d"/>

    <!-- Car (from camera view) -->
    <rect x="50" y="120" width="80" height="40" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <circle cx="60" cy="165" r="10" fill="#2c3e50"/>
    <circle cx="120" cy="165" r="10" fill="#2c3e50"/>

    <!-- Person -->
    <rect x="180" y="110" width="15" height="30" fill="#e74c3c"/>
    <circle cx="187" cy="105" r="7" fill="#e74c3c"/>

    <!-- Trees -->
    <rect x="230" y="100" width="10" height="50" fill="#27ae60"/>
    <circle cx="235" cy="85" r="20" fill="#2ecc71"/>

    <rect x="270" y="100" width="10" height="50" fill="#27ae60"/>
    <circle cx="275" cy="85" r="20" fill="#2ecc71"/>

    <text x="150" y="50" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Camera View (RGB Image)</text>
  </g>

  <!-- LiDAR Point Cloud View -->
  <g transform="translate(50, 300)">
    <!-- Road points -->
    <g fill="#6c757d">
      <circle cx="20" cy="80" r="2"/>
      <circle cx="40" cy="82" r="2"/>
      <circle cx="60" cy="81" r="2"/>
      <circle cx="80" cy="83" r="2"/>
      <circle cx="100" cy="80" r="2"/>
      <circle cx="120" cy="82" r="2"/>
      <circle cx="140" cy="81" r="2"/>
      <circle cx="160" cy="83" r="2"/>
      <circle cx="180" cy="80" r="2"/>
      <circle cx="200" cy="82" r="2"/>
      <circle cx="220" cy="81" r="2"/>
      <circle cx="240" cy="83" r="2"/>
      <circle cx="260" cy="80" r="2"/>
      <circle cx="280" cy="82" r="2"/>
    </g>

    <!-- Car points -->
    <g fill="#3498db">
      <circle cx="55" cy="60" r="2"/>
      <circle cx="60" cy="58" r="2"/>
      <circle cx="65" cy="59" r="2"/>
      <circle cx="70" cy="61" r="2"/>
      <circle cx="75" cy="60" r="2"/>
      <circle cx="80" cy="58" r="2"/>
      <circle cx="85" cy="59" r="2"/>
      <circle cx="90" cy="61" r="2"/>
      <circle cx="95" cy="60" r="2"/>
      <circle cx="100" cy="58" r="2"/>
    </g>

    <!-- Person points -->
    <g fill="#e74c3c">
      <circle cx="185" cy="55" r="2"/>
      <circle cx="188" cy="53" r="2"/>
      <circle cx="190" cy="56" r="2"/>
      <circle cx="192" cy="54" r="2"/>
      <circle cx="195" cy="55" r="2"/>
    </g>

    <!-- Tree points -->
    <g fill="#27ae60">
      <circle cx="235" cy="45" r="2"/>
      <circle cx="240" cy="42" r="2"/>
      <circle cx="245" cy="46" r="2"/>
      <circle cx="250" cy="43" r="2"/>
      <circle cx="255" cy="47" r="2"/>
      <circle cx="260" cy="44" r="2"/>
      <circle cx="265" cy="48" r="2"/>
      <circle cx="270" cy="45" r="2"/>
      <circle cx="275" cy="49" r="2"/>
    </g>

    <text x="150" y="30" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">LiDAR Point Cloud</text>
  </g>

  <!-- Fusion Result -->
  <g transform="translate(450, 200)">
    <!-- Fused representation -->
    <rect x="0" y="0" width="300" height="200" fill="#e9ecef" stroke="#6c757d" stroke-width="2"/>

    <!-- Fused car with color and depth -->
    <g>
      <rect x="50" y="40" width="80" height="40" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
      <text x="90" y="35" text-anchor="middle" font-family="Arial" font-size="10" fill="#2c3e50">Car: 15m</text>
      <circle cx="60" cy="85" r="10" fill="#2c3e50"/>
      <circle cx="120" cy="85" r="10" fill="#2c3e50"/>
    </g>

    <!-- Fused person with color and depth -->
    <g>
      <rect x="180" y="30" width="15" height="30" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
      <text x="187" y="25" text-anchor="middle" font-family="Arial" font-size="10" fill="#2c3e50">Person: 12m</text>
      <circle cx="187" cy="25" r="7" fill="#e74c3c"/>
    </g>

    <!-- Fused trees with color and depth -->
    <g>
      <rect x="230" y="20" width="10" height="50" fill="#27ae60" stroke="#229954" stroke-width="1"/>
      <circle cx="235" cy="5" r="20" fill="#2ecc71"/>
      <text x="235" y="-10" text-anchor="middle" font-family="Arial" font-size="10" fill="#2c3e50">Tree: 18m</text>
    </g>

    <g>
      <rect x="270" y="20" width="10" height="50" fill="#27ae60" stroke="#229954" stroke-width="1"/>
      <circle cx="275" cy="5" r="20" fill="#2ecc71"/>
      <text x="275" y="-10" text-anchor="middle" font-family="Arial" font-size="10" fill="#2c3e50">Tree: 20m</text>
    </g>

    <text x="150" y="-30" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Fused RGB-D Scene</text>
    <text x="150" y="-15" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">(Rich color + accurate depth)</text>
  </g>

  <!-- Arrows showing fusion process -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>

  <line x1="350" y1="180" x2="450" y2="220" stroke="#555" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <line x1="350" y1="380" x2="450" y2="280" stroke="#555" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>

  <!-- Labels -->
  <text x="450" y="50" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#333">LiDAR-Camera Fusion Concept</text>
  <text x="450" y="75" text-anchor="middle" font-family="Arial" font-size="14" fill="#666">Combining dense color information with accurate depth measurements</text>
</svg>