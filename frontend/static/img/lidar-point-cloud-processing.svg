<!-- Placeholder SVG for LiDAR Point Cloud Processing -->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <title>LiDAR Point Cloud Processing</title>
  <desc>Diagram showing the processing steps for LiDAR point cloud data</desc>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa"/>

  <!-- Robot with LiDAR -->
  <g transform="translate(100, 250)">
    <rect x="-30" y="-40" width="60" height="80" fill="none" stroke="#333" stroke-width="2" rx="5"/>
    <circle cx="0" cy="-50" r="15" fill="#e15759" fill-opacity="0.5" stroke="#e15759" stroke-width="2"/>
    <text x="0" y="-65" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">LiDAR</text>

    <!-- Sample rays -->
    <line x1="0" y1="-35" x2="50" y2="-100" stroke="#aaa" stroke-width="1"/>
    <line x1="0" y1="-35" x2="80" y2="-80" stroke="#aaa" stroke-width="1"/>
    <line x1="0" y1="-35" x2="100" y2="-50" stroke="#aaa" stroke-width="1"/>
    <line x1="0" y1="-35" x2="110" y2="-10" stroke="#aaa" stroke-width="1"/>
    <line x1="0" y1="-35" x2="100" y2="30" stroke="#aaa" stroke-width="1"/>
  </g>

  <!-- Raw Point Cloud -->
  <g transform="translate(250, 200)">
    <!-- Simulated point cloud -->
    <circle cx="-20" cy="-30" r="3" fill="#4e79a7"/>
    <circle cx="10" cy="-40" r="3" fill="#4e79a7"/>
    <circle cx="30" cy="-20" r="3" fill="#4e79a7"/>
    <circle cx="-10" cy="10" r="3" fill="#4e79a7"/>
    <circle cx="20" cy="25" r="3" fill="#4e79a7"/>
    <circle cx="-30" cy="35" r="3" fill="#4e79a7"/>
    <circle cx="0" cy="-10" r="3" fill="#4e79a7"/>
    <circle cx="15" cy="-5" r="3" fill="#4e79a7"/>
    <circle cx="-15" cy="20" r="3" fill="#4e79a7"/>
    <circle cx="25" cy="0" r="3" fill="#4e79a7"/>

    <text x="0" y="60" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Raw Point Cloud</text>
  </g>

  <!-- Ground Plane Segmentation -->
  <g transform="translate(400, 200)">
    <!-- Ground points (blue) -->
    <circle cx="-20" cy="35" r="3" fill="#4e79a7"/>
    <circle cx="-30" cy="35" r="3" fill="#4e79a7"/>
    <circle cx="0" cy="35" r="3" fill="#4e79a7"/>
    <circle cx="15" cy="35" r="3" fill="#4e79a7"/>
    <circle cx="25" cy="35" r="3" fill="#4e79a7"/>

    <!-- Obstacle points (red) -->
    <circle cx="-20" cy="-30" r="3" fill="#e15759"/>
    <circle cx="10" cy="-40" r="3" fill="#e15759"/>
    <circle cx="30" cy="-20" r="3" fill="#e15759"/>
    <circle cx="-10" cy="10" r="3" fill="#e15759"/>
    <circle cx="20" cy="25" r="3" fill="#e15759"/>
    <circle cx="0" cy="-10" r="3" fill="#e15759"/>
    <circle cx="15" cy="-5" r="3" fill="#e15759"/>
    <circle cx="-15" cy="20" r="3" fill="#e15759"/>
    <circle cx="25" cy="0" r="3" fill="#e15759"/>

    <!-- Ground plane -->
    <line x1="-40" y1="35" x2="40" y2="35" stroke="#76b7b2" stroke-width="2" stroke-dasharray="5,5"/>

    <text x="0" y="60" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Ground Segmentation</text>
  </g>

  <!-- Clustering -->
  <g transform="translate(550, 200)">
    <!-- Cluster 1 (green) -->
    <circle cx="-20" cy="-30" r="3" fill="#76b7b2"/>
    <circle cx="10" cy="-40" r="3" fill="#76b7b2"/>
    <circle cx="30" cy="-20" r="3" fill="#76b7b2"/>
    <circle cx="0" cy="-10" r="3" fill="#76b7b2"/>
    <circle cx="15" cy="-5" r="3" fill="#76b7b2"/>

    <!-- Cluster 2 (orange) -->
    <circle cx="-10" cy="10" r="3" fill="#f28e2c"/>
    <circle cx="20" cy="25" r="3" fill="#f28e2c"/>
    <circle cx="-15" cy="20" r="3" fill="#f28e2c"/>
    <circle cx="25" cy="0" r="3" fill="#f28e2c"/>

    <!-- Cluster 3 (purple) -->
    <circle cx="-30" cy="35" r="3" fill="#b279a2"/>
    <circle cx="-20" cy="35" r="3" fill="#b279a2"/>
    <circle cx="0" cy="35" r="3" fill="#b279a2"/>
    <circle cx="15" cy="35" r="3" fill="#b279a2"/>
    <circle cx="25" cy="35" r="3" fill="#b279a2"/>

    <text x="0" y="60" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Clustering</text>
  </g>

  <!-- Arrows showing processing flow -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>

  <line x1="130" y1="250" x2="220" y2="230" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="230" x2="370" y2="230" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="230" x2="520" y2="230" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Labels -->
  <text x="400" y="50" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#333">LiDAR Point Cloud Processing</text>
  <text x="400" y="75" text-anchor="middle" font-family="Arial" font-size="14" fill="#666">From raw sensor data to meaningful environmental understanding</text>
</svg>