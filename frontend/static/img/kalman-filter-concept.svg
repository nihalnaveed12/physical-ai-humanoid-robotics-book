<!-- Kalman Filter Concept Diagram -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <title>Kalman Filter Concept</title>
  <desc>Diagram illustrating the Kalman filter prediction and update cycle</desc>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa"/>

  <!-- Prediction Step -->
  <g transform="translate(150, 150)">
    <rect x="-100" y="-60" width="200" height="120" fill="#e9ecef" stroke="#6c757d" stroke-width="2" rx="10"/>
    <text x="0" y="-40" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#333">Prediction Step</text>

    <!-- State prediction -->
    <g transform="translate(0, -10)">
      <ellipse cx="0" cy="0" rx="40" ry="20" fill="#59a14f" stroke="#477e3d" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="12" fill="white">x̂ₖ⁻</text>
      <text x="0" y="20" text-anchor="middle" font-family="Arial" font-size="10" fill="white">(Predicted State)</text>
    </g>

    <!-- Covariance prediction -->
    <g transform="translate(0, 30)">
      <ellipse cx="0" cy="0" rx="40" ry="20" fill="#4e79a7" stroke="#3d5e7a" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="12" fill="white">Pₖ⁻</text>
      <text x="0" y="20" text-anchor="middle" font-family="Arial" font-size="10" fill="white">(Predicted Covariance)</text>
    </g>
  </g>

  <!-- Update Step -->
  <g transform="translate(650, 150)">
    <rect x="-100" y="-60" width="200" height="120" fill="#e9ecef" stroke="#6c757d" stroke-width="2" rx="10"/>
    <text x="0" y="-40" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#333">Update Step</text>

    <!-- Updated state -->
    <g transform="translate(0, -10)">
      <ellipse cx="0" cy="0" rx="40" ry="20" fill="#e15759" stroke="#b34547" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="12" fill="white">x̂ₖ</text>
      <text x="0" y="20" text-anchor="middle" font-family="Arial" font-size="10" fill="white">(Updated State)</text>
    </g>

    <!-- Updated covariance -->
    <g transform="translate(0, 30)">
      <ellipse cx="0" cy="0" rx="40" ry="20" fill="#76b7b2" stroke="#5a8f8b" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="12" fill="white">Pₖ</text>
      <text x="0" y="20" text-anchor="middle" font-family="Arial" font-size="10" fill="white">(Updated Covariance)</text>
    </g>
  </g>

  <!-- Measurement Input -->
  <g transform="translate(650, 350)">
    <ellipse cx="0" cy="0" rx="50" ry="25" fill="#f28e2c" stroke="#c27225" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="12" fill="white">zₖ</text>
    <text x="0" y="20" text-anchor="middle" font-family="Arial" font-size="10" fill="white">(Measurement)</text>
  </g>

  <!-- Process Model -->
  <g transform="translate(150, 350)">
    <rect x="-60" y="-20" width="120" height="40" fill="#b279a2" stroke="#8e6282" stroke-width="2" rx="5"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="12" fill="white">Process Model</text>
    <text x="0" y="20" text-anchor="middle" font-family="Arial" font-size="10" fill="white">(F, B, u, Q)</text>
  </g>

  <!-- Measurement Model -->
  <g transform="translate(450, 350)">
    <rect x="-60" y="-20" width="120" height="40" fill="#b279a2" stroke="#8e6282" stroke-width="2" rx="5"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="12" fill="white">Measurement Model</text>
    <text x="0" y="20" text-anchor="middle" font-family="Arial" font-size="10" fill="white">(H, R)</text>
  </g>

  <!-- Time Step Labels -->
  <text x="150" y="100" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Time k-1</text>
  <text x="150" y="120" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">State: x̂ₖ₋₁, Cov: Pₖ₋₁</text>

  <text x="650" y="100" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Time k</text>
  <text x="650" y="120" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">State: x̂ₖ, Cov: Pₖ</text>

  <!-- Arrows showing the process -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Process model arrow -->
  <line x1="150" y1="330" x2="150" y2="230" stroke="#555" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>

  <!-- Prediction arrow -->
  <line x1="250" y1="180" x2="550" y2="180" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="170" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">Predict</text>

  <!-- Measurement model arrow -->
  <line x1="550" y1="350" x2="550" y2="250" stroke="#555" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="580" y="300" text-anchor="middle" font-family="Arial" font-size="12" fill="#555" transform="rotate(-90 580,300)">Measurement</text>
  <text x="580" y="315" text-anchor="middle" font-family="Arial" font-size="12" fill="#555" transform="rotate(-90 580,300)">Model</text>

  <!-- Update arrow -->
  <line x1="650" y1="230" x2="650" y2="330" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="680" y="280" text-anchor="middle" font-family="Arial" font-size="12" fill="#555" transform="rotate(-90 680,280)">Update</text>

  <!-- Kalman Gain Calculation -->
  <g transform="translate(450, 450)">
    <rect x="-80" y="-30" width="160" height="60" fill="#59a14f" stroke="#477e3d" stroke-width="2" rx="5"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Arial" font-size="12" fill="white">Kalman Gain</text>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="12" fill="white">Kₖ = Pₖ⁻Hᵀ(HPₖ⁻Hᵀ + R)⁻¹</text>
    <text x="0" y="20" text-anchor="middle" font-family="Arial" font-size="10" fill="white">(Optimal weighting)</text>
  </g>

  <!-- Kalman Gain arrow -->
  <line x1="450" y1="420" x2="450" y2="290" stroke="#e15759" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Labels -->
  <text x="450" y="50" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#333">Kalman Filter Algorithm</text>
  <text x="450" y="75" text-anchor="middle" font-family="Arial" font-size="14" fill="#666">Optimal estimation through prediction and measurement update cycles</text>

  <!-- Cycle arrow -->
  <path d="M750,200 C800,200 800,100 700,100" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="770" y="150" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">Repeat</text>
</svg>