<!-- Sensor Validation Pipeline -->
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
  <title>Sensor Validation Pipeline</title>
  <desc>Diagram showing the comprehensive sensor validation pipeline for robotics perception systems</desc>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa"/>

  <!-- Main title -->
  <text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#333">Sensor Validation Pipeline</text>
  <text x="500" y="65" text-anchor="middle" font-family="Arial" font-size="16" fill="#666">Comprehensive validation for reliable perception systems</text>

  <!-- Sensor Input Stage -->
  <g transform="translate(100, 120)">
    <circle cx="0" cy="0" r="40" fill="#4e79a7" stroke="#4e79a7" stroke-width="3"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">Sensor</text>
    <text x="0" y="10" text-anchor="middle" font-family="Arial" font-size="12" fill="white">Input</text>

    <!-- Example sensors -->
    <g transform="translate(-60, 40)">
      <rect x="0" y="0" width="30" height="15" fill="#f28e2c" stroke="#f28e2c" stroke-width="1" rx="3"/>
      <text x="15" y="11" text-anchor="middle" font-family="Arial" font-size="8" fill="white">Camera</text>
    </g>
    <g transform="translate(30, 40)">
      <rect x="0" y="0" width="30" height="15" fill="#e15759" stroke="#e15759" stroke-width="1" rx="3"/>
      <text x="15" y="11" text-anchor="middle" font-family="Arial" font-size="8" fill="white">LiDAR</text>
    </g>
    <g transform="translate(-15, 55)">
      <rect x="0" y="0" width="30" height="15" fill="#76b7b2" stroke="#76b7b2" stroke-width="1" rx="3"/>
      <text x="15" y="11" text-anchor="middle" font-family="Arial" font-size="8" fill="white">IMU</text>
    </g>
  </g>

  <!-- Data Quality Assessment -->
  <g transform="translate(250, 120)">
    <rect x="-60" y="-40" width="120" height="80" fill="#f28e2c" fill-opacity="0.3" stroke="#f28e2c" stroke-width="3" rx="10"/>
    <text x="0" y="-20" text-anchor="middle" font-family="Arial" font-size="14" fill="#333" font-weight="bold">Data Quality</text>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">Assessment</text>

    <!-- Quality checks -->
    <g transform="translate(-50, 15)">
      <circle cx="0" cy="0" r="4" fill="#f28e2c"/>
      <text x="10" y="5" font-family="Arial" font-size="10" fill="#333">Noise Level</text>
    </g>
    <g transform="translate(-50, 30)">
      <circle cx="0" cy="0" r="4" fill="#f28e2c"/>
      <text x="10" y="5" font-family="Arial" font-size="10" fill="#333">Signal Strength</text>
    </g>
    <g transform="translate(-50, 45)">
      <circle cx="0" cy="0" r="4" fill="#f28e2c"/>
      <text x="10" y="5" font-family="Arial" font-size="10" fill="#333">Data Rate</text>
    </g>
  </g>

  <!-- Intrinsic Validation -->
  <g transform="translate(450, 80)">
    <rect x="-60" y="-40" width="120" height="80" fill="#e15759" fill-opacity="0.3" stroke="#e15759" stroke-width="3" rx="10"/>
    <text x="0" y="-20" text-anchor="middle" font-family="Arial" font-size="14" fill="#333" font-weight="bold">Intrinsic</text>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">Validation</text>

    <!-- Intrinsic checks -->
    <g transform="translate(-50, 15)">
      <circle cx="0" cy="0" r="4" fill="#e15759"/>
      <text x="10" y="5" font-family="Arial" font-size="10" fill="#333">Calibration</text>
    </g>
    <g transform="translate(-50, 30)">
      <circle cx="0" cy="0" r="4" fill="#e15759"/>
      <text x="10" y="5" font-family="Arial" font-size="10" fill="#333">Range Limits</text>
    </g>
    <g transform="translate(-50, 45)">
      <circle cx="0" cy="0" r="4" fill="#e15759"/>
      <text x="10" y="5" font-family="Arial" font-size="10" fill="#333">Resolution</text>
    </g>
  </g>

  <!-- Extrinsic Validation -->
  <g transform="translate(450, 200)">
    <rect x="-60" y="-40" width="120" height="80" fill="#76b7b2" fill-opacity="0.3" stroke="#76b7b2" stroke-width="3" rx="10"/>
    <text x="0" y="-20" text-anchor="middle" font-family="Arial" font-size="14" fill="#333" font-weight="bold">Extrinsic</text>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">Validation</text>

    <!-- Extrinsic checks -->
    <g transform="translate(-50, 15)">
      <circle cx="0" cy="0" r="4" fill="#76b7b2"/>
      <text x="10" y="5" font-family="Arial" font-size="10" fill="#333">Alignment</text>
    </g>
    <g transform="translate(-50, 30)">
      <circle cx="0" cy="0" r="4" fill="#76b7b2"/>
      <text x="10" y="5" font-family="Arial" font-size="10" fill="#333">Cross-Sensor</text>
    </g>
    <g transform="translate(-50, 45)">
      <circle cx="0" cy="0" r="4" fill="#76b7b2"/>
      <text x="10" y="5" font-family="Arial" font-size="10" fill="#333">Geometry</text>
    </g>
  </g>

  <!-- Temporal Validation -->
  <g transform="translate(450, 320)">
    <rect x="-60" y="-40" width="120" height="80" fill="#59a14f" fill-opacity="0.3" stroke="#59a14f" stroke-width="3" rx="10"/>
    <text x="0" y="-20" text-anchor="middle" font-family="Arial" font-size="14" fill="#333" font-weight="bold">Temporal</text>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">Validation</text>

    <!-- Temporal checks -->
    <g transform="translate(-50, 15)">
      <circle cx="0" cy="0" r="4" fill="#59a14f"/>
      <text x="10" y="5" font-family="Arial" font-size="10" fill="#333">Consistency</text>
    </g>
    <g transform="translate(-50, 30)">
      <circle cx="0" cy="0" r="4" fill="#59a14f"/>
      <text x="10" y="5" font-family="Arial" font-size="10" fill="#333">Drift Detection</text>
    </g>
    <g transform="translate(-50, 45)">
      <circle cx="0" cy="0" r="4" fill="#59a14f"/>
      <text x="10" y="5" font-family="Arial" font-size="10" fill="#333">Stability</text>
    </g>
  </g>

  <!-- Failure Detection -->
  <g transform="translate(650, 120)">
    <rect x="-60" y="-40" width="120" height="80" fill="#b279a2" fill-opacity="0.3" stroke="#b279a2" stroke-width="3" rx="10"/>
    <text x="0" y="-20" text-anchor="middle" font-family="Arial" font-size="14" fill="#333" font-weight="bold">Failure</text>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">Detection</text>

    <!-- Failure detection -->
    <g transform="translate(-50, 15)">
      <circle cx="0" cy="0" r="4" fill="#b279a2"/>
      <text x="10" y="5" font-family="Arial" font-size="10" fill="#333">Anomaly</text>
    </g>
    <g transform="translate(-50, 30)">
      <circle cx="0" cy="0" r="4" fill="#b279a2"/>
      <text x="10" y="5" font-family="Arial" font-size="10" fill="#333">Stuck Values</text>
    </g>
    <g transform="translate(-50, 45)">
      <circle cx="0" cy="0" r="4" fill="#b279a2"/>
      <text x="10" y="5" font-family="Arial" font-size="10" fill="#333">Outliers</text>
    </g>
  </g>

  <!-- Validation Output -->
  <g transform="translate(850, 120)">
    <rect x="-50" y="-40" width="100" height="80" fill="#edc949" fill-opacity="0.3" stroke="#edc949" stroke-width="3" rx="10"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Arial" font-size="14" fill="#333" font-weight="bold">Validation</text>
    <text x="0" y="10" text-anchor="middle" font-family="Arial" font-size="14" fill="#333" font-weight="bold">Output</text>

    <!-- Status indicators -->
    <g transform="translate(-40, 35)">
      <circle cx="0" cy="0" r="6" fill="#59a14f"/>  <!-- Green for valid -->
      <text x="15" y="5" font-family="Arial" font-size="10" fill="#333">Valid</text>
    </g>
    <g transform="translate(10, 35)">
      <circle cx="0" cy="0" r="6" fill="#f28e2c"/>  <!-- Orange for warning -->
      <text x="15" y="5" font-family="Arial" font-size="10" fill="#333">Warning</text>
    </g>
    <g transform="translate(-15, 55)">
      <circle cx="0" cy="0" r="6" fill="#e15759"/>  <!-- Red for invalid -->
      <text x="15" y="5" font-family="Arial" font-size="10" fill="#333">Invalid</text>
    </g>
  </g>

  <!-- Arrows showing flow -->
  <defs>
    <marker id="arrow" markerWidth="15" markerHeight="15" refX="14" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,14 L14,7 Z" fill="#555"/>
    </marker>
  </defs>

  <!-- Main flow arrows -->
  <line x1="140" y1="120" x2="210" y2="120" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="310" y1="120" x2="390" y2="120" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="510" y1="120" x2="590" y2="120" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="710" y1="120" x2="790" y2="120" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Vertical arrows for multi-path validation -->
  <line x1="510" y1="160" x2="510" y2="200" stroke="#555" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <line x1="510" y1="280" x2="510" y2="320" stroke="#555" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>

  <line x1="590" y1="200" x2="590" y2="160" stroke="#555" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <line x1="590" y1="320" x2="590" y2="160" stroke="#555" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>

  <!-- Validation Feedback Loop -->
  <path d="M850,160 C900,160 900,80 650,80" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="750" y="60" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">Feedback</text>

  <!-- Validation Categories -->
  <g transform="translate(100, 450)">
    <rect x="-80" y="-30" width="160" height="100" fill="#4e79a7" fill-opacity="0.2" stroke="#4e79a7" stroke-width="2" rx="10"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Arial" font-size="14" fill="#333" font-weight="bold">Validation</text>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">Categories</text>

    <g transform="translate(-70, 20)">
      <circle cx="0" cy="0" r="4" fill="#4e79a7"/>
      <text x="10" y="5" font-family="Arial" font-size="10" fill="#333">Intrinsic: Self-validation</text>
    </g>
    <g transform="translate(-70, 35)">
      <circle cx="0" cy="0" r="4" fill="#4e79a7"/>
      <text x="10" y="5" font-family="Arial" font-size="10" fill="#333">Extrinsic: Cross-validation</text>
    </g>
    <g transform="translate(-70, 50)">
      <circle cx="0" cy="0" r="4" fill="#4e79a7"/>
      <text x="10" y="5" font-family="Arial" font-size="10" fill="#333">Temporal: Time-series validation</text>
    </g>
    <g transform="translate(-70, 65)">
      <circle cx="0" cy="0" r="4" fill="#4e79a7"/>
      <text x="10" y="5" font-family="Arial" font-size="10" fill="#333">Functional: Performance validation</text>
    </g>
  </g>

  <!-- Validation Techniques -->
  <g transform="translate(350, 450)">
    <rect x="-100" y="-30" width="200" height="100" fill="#f28e2c" fill-opacity="0.2" stroke="#f28e2c" stroke-width="2" rx="10"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Arial" font-size="14" fill="#333" font-weight="bold">Validation</text>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">Techniques</text>

    <g transform="translate(-90, 20)">
      <circle cx="0" cy="0" r="4" fill="#f28e2c"/>
      <text x="10" y="5" font-family="Arial" font-size="10" fill="#333">Statistical Analysis</text>
    </g>
    <g transform="translate(-90, 35)">
      <circle cx="0" cy="0" r="4" fill="#f28e2c"/>
      <text x="10" y="5" font-family="Arial" font-size="10" fill="#333">Machine Learning</text>
    </g>
    <g transform="translate(-90, 50)">
      <circle cx="0" cy="0" r="4" fill="#f28e2c"/>
      <text x="10" y="5" font-family="Arial" font-size="10" fill="#333">Pattern Recognition</text>
    </g>
    <g transform="translate(-90, 65)">
      <circle cx="0" cy="0" r="4" fill="#f28e2c"/>
      <text x="10" y="5" font-family="Arial" font-size="10" fill="#333">Threshold Checking</text>
    </g>
  </g>

  <!-- Continuous Monitoring -->
  <g transform="translate(650, 450)">
    <rect x="-80" y="-30" width="160" height="100" fill="#59a14f" fill-opacity="0.2" stroke="#59a14f" stroke-width="2" rx="10"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Arial" font-size="14" fill="#333" font-weight="bold">Continuous</text>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">Monitoring</text>

    <g transform="translate(-70, 20)">
      <circle cx="0" cy="0" r="4" fill="#59a14f"/>
      <text x="10" y="5" font-family="Arial" font-size="10" fill="#333">Real-time Validation</text>
    </g>
    <g transform="translate(-70, 35)">
      <circle cx="0" cy="0" r="4" fill="#59a14f"/>
      <text x="10" y="5" font-family="Arial" font-size="10" fill="#333">Health Monitoring</text>
    </g>
    <g transform="translate(-70, 50)">
      <circle cx="0" cy="0" r="4" fill="#59a14f"/>
      <text x="10" y="5" font-family="Arial" font-size="10" fill="#333">Performance Tracking</text>
    </g>
    <g transform="translate(-70, 65)">
      <circle cx="0" cy="0" r="4" fill="#59a14f"/>
      <text x="10" y="5" font-family="Arial" font-size="10" fill="#333">Alert Generation</text>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(50, 570)">
    <text x="0" y="0" font-family="Arial" font-size="12" font-weight="bold" fill="#333">Legend:</text>
    <g transform="translate(100, 0)">
      <circle cx="0" cy="0" r="5" fill="#4e79a7"/>
      <text x="10" y="5" font-family="Arial" font-size="10" fill="#333">Sensor Input</text>
    </g>
    <g transform="translate(200, 0)">
      <circle cx="0" cy="0" r="5" fill="#f28e2c"/>
      <text x="10" y="5" font-family="Arial" font-size="10" fill="#333">Quality Assessment</text>
    </g>
    <g transform="translate(320, 0)">
      <circle cx="0" cy="0" r="5" fill="#e15759"/>
      <text x="10" y="5" font-family="Arial" font-size="10" fill="#333">Intrinsic Validation</text>
    </g>
    <g transform="translate(450, 0)">
      <circle cx="0" cy="0" r="5" fill="#76b7b2"/>
      <text x="10" y="5" font-family="Arial" font-size="10" fill="#333">Extrinsic Validation</text>
    </g>
    <g transform="translate(580, 0)">
      <circle cx="0" cy="0" r="5" fill="#59a14f"/>
      <text x="10" y="5" font-family="Arial" font-size="10" fill="#333">Temporal Validation</text>
    </g>
  </g>
</svg>