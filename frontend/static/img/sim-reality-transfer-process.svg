<!-- Sim-to-Reality Transfer Process Diagram -->
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <title>Sim-to-Reality Transfer Process</title>
  <desc>Diagram showing the process of transferring from simulation to reality with validation steps</desc>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa"/>

  <!-- Simulation Environment -->
  <g transform="translate(100, 100)">
    <rect x="-80" y="-50" width="160" height="100" fill="#4e79a7" fill-opacity="0.3" stroke="#4e79a7" stroke-width="3" rx="10"/>
    <text x="0" y="-20" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Simulation</text>
    <text x="0" y="0" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Environment</text>

    <!-- Simulation components -->
    <g transform="translate(-60, 20)">
      <rect x="0" y="0" width="40" height="20" fill="#f28e2c" fill-opacity="0.5" stroke="#f28e2c" stroke-width="1" rx="3"/>
      <text x="20" y="13" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Camera</text>
    </g>

    <g transform="translate(10, 20)">
      <rect x="0" y="0" width="40" height="20" fill="#e15759" fill-opacity="0.5" stroke="#e15759" stroke-width="1" rx="3"/>
      <text x="20" y="13" text-anchor="middle" font-family="Arial" font-size="10" fill="white">LiDAR</text>
    </g>

    <g transform="translate(-25, 45)">
      <rect x="0" y="0" width="50" height="20" fill="#76b7b2" fill-opacity="0.5" stroke="#76b7b2" stroke-width="1" rx="3"/>
      <text x="25" y="13" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Physics Engine</text>
    </g>
  </g>

  <!-- Reality Environment -->
  <g transform="translate(750, 100)">
    <rect x="-80" y="-50" width="160" height="100" fill="#e15759" fill-opacity="0.3" stroke="#e15759" stroke-width="3" rx="10"/>
    <text x="0" y="-20" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Reality</text>
    <text x="0" y="0" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Environment</text>

    <!-- Reality components -->
    <g transform="translate(-60, 20)">
      <rect x="0" y="0" width="40" height="20" fill="#f28e2c" fill-opacity="0.7" stroke="#f28e2c" stroke-width="1" rx="3"/>
      <text x="20" y="13" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Camera</text>
    </g>

    <g transform="translate(10, 20)">
      <rect x="0" y="0" width="40" height="20" fill="#e15759" fill-opacity="0.7" stroke="#e15759" stroke-width="1" rx="3"/>
      <text x="20" y="13" text-anchor="middle" font-family="Arial" font-size="10" fill="white">LiDAR</text>
    </g>

    <g transform="translate(-25, 45)">
      <rect x="0" y="0" width="50" height="20" fill="#76b7b2" fill-opacity="0.7" stroke="#76b7b2" stroke-width="1" rx="3"/>
      <text x="25" y="13" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Physical World</text>
    </g>
  </g>

  <!-- Transfer Process Arrow -->
  <defs>
    <marker id="arrow" markerWidth="15" markerHeight="15" refX="14" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,14 L14,7 Z" fill="#555"/>
    </marker>
  </defs>

  <line x1="230" y1="100" x2="670" y2="100" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="450" y="85" text-anchor="middle" font-family="Arial" font-size="14" fill="#333" font-weight="bold">Sim-to-Reality Transfer</text>

  <!-- Validation Steps -->
  <g transform="translate(400, 250)">
    <!-- Step 1: Data Collection -->
    <g transform="translate(0, 0)">
      <rect x="-100" y="-25" width="200" height="50" fill="#59a14f" fill-opacity="0.3" stroke="#59a14f" stroke-width="2" rx="5"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">Step 1: Data Collection</text>
      <text x="0" y="20" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Collect sim & real data pairs</text>
    </g>

    <!-- Step 2: Gap Analysis -->
    <g transform="translate(0, 70)">
      <rect x="-100" y="-25" width="200" height="50" fill="#b279a2" fill-opacity="0.3" stroke="#b279a2" stroke-width="2" rx="5"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">Step 2: Gap Analysis</text>
      <text x="0" y="20" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Quantify reality gaps</text>
    </g>

    <!-- Step 3: Adaptation -->
    <g transform="translate(0, 140)">
      <rect x="-100" y="-25" width="200" height="50" fill="#ff9da7" fill-opacity="0.3" stroke="#ff9da7" stroke-width="2" rx="5"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">Step 3: Adaptation</text>
      <text x="0" y="20" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Apply domain adaptation</text>
    </g>

    <!-- Step 4: Validation -->
    <g transform="translate(0, 210)">
      <rect x="-100" y="-25" width="200" height="50" fill="#edc949" fill-opacity="0.3" stroke="#edc949" stroke-width="2" rx="5"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">Step 4: Validation</text>
      <text x="0" y="20" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Test in real environment</text>
    </g>
  </g>

  <!-- Arrows connecting validation steps -->
  <defs>
    <marker id="smallArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 Z" fill="#555"/>
    </marker>
  </defs>

  <line x1="400" y1="250" x2="400" y2="300" stroke="#555" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#smallArrow)"/>
  <line x1="400" y1="320" x2="400" y2="370" stroke="#555" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#smallArrow)"/>
  <line x1="400" y1="390" x2="400" y2="440" stroke="#555" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#smallArrow)"/>

  <!-- Domain Randomization -->
  <g transform="translate(250, 500)">
    <rect x="-120" y="-40" width="240" height="80" fill="#bab0ac" fill-opacity="0.3" stroke="#bab0ac" stroke-width="2" rx="10"/>
    <text x="0" y="-20" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Domain Randomization</text>
    <text x="0" y="0" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">Randomize simulation parameters</text>
    <text x="0" y="15" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">to improve real-world transfer</text>

    <!-- Randomization parameters -->
    <g transform="translate(-90, 30)">
      <circle r="5" fill="#4e79a7"/>
      <text x="10" y="5" font-family="Arial" font-size="10" fill="#333">Lighting</text>
    </g>
    <g transform="translate(-30, 30)">
      <circle r="5" fill="#f28e2c"/>
      <text x="10" y="5" font-family="Arial" font-size="10" fill="#333">Textures</text>
    </g>
    <g transform="translate(30, 30)">
      <circle r="5" fill="#e15759"/>
      <text x="10" y="5" font-family="Arial" font-size="10" fill="#333">Colors</text>
    </g>
    <g transform="translate(90, 30)">
      <circle r="5" fill="#76b7b2"/>
      <text x="10" y="5" font-family="Arial" font-size="10" fill="#333">Physics</text>
    </g>
  </g>

  <!-- Adaptation Techniques -->
  <g transform="translate(650, 500)">
    <rect x="-100" y="-40" width="200" height="80" fill="#d37295" fill-opacity="0.3" stroke="#d37295" stroke-width="2" rx="10"/>
    <text x="0" y="-20" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Adaptation Techniques</text>
    <text x="0" y="0" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">Methods to bridge sim-reality gap</text>

    <!-- Techniques -->
    <g transform="translate(-70, 20)">
      <rect x="0" y="0" width="40" height="15" fill="#59a14f" fill-opacity="0.7" stroke="#59a14f" stroke-width="1" rx="3"/>
      <text x="20" y="10" text-anchor="middle" font-family="Arial" font-size="9" fill="white">DA</text>
    </g>
    <g transform="translate(-20, 20)">
      <rect x="0" y="0" width="40" height="15" fill="#b279a2" fill-opacity="0.7" stroke="#b279a2" stroke-width="1" rx="3"/>
      <text x="20" y="10" text-anchor="middle" font-family="Arial" font-size="9" fill="white">GAN</text>
    </g>
    <g transform="translate(30, 20)">
      <rect x="0" y="0" width="40" height="15" fill="#ff9da7" fill-opacity="0.7" stroke="#ff9da7" stroke-width="1" rx="3"/>
      <text x="20" y="10" text-anchor="middle" font-family="Arial" font-size="9" fill="white">FT</text>
    </g>

    <!-- Labels -->
    <text x="-50" y="38" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">DA=Domain</text>
    <text x="-50" y="48" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">Adapt</text>
    <text x="0" y="38" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">GAN=Image</text>
    <text x="0" y="48" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">Translation</text>
    <text x="50" y="38" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">FT=Fine</text>
    <text x="50" y="48" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">Tuning</text>
  </g>

  <!-- Main title -->
  <text x="500" y="50" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#333">Simulation-to-Reality Transfer Process</text>
  <text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" fill="#666">Bridging the gap between simulation and real-world deployment</text>
</svg>